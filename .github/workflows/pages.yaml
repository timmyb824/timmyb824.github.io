name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate status.json
        env:
          STATUS_AUTH_URL: ${{ secrets.STATUS_AUTH_URL }}
          STATUS_GRAFANA_URL: ${{ secrets.STATUS_GRAFANA_URL }}
          STATUS_N8N_URL: ${{ secrets.STATUS_N8N_URL }}
          STATUS_SEARXNG_URL: ${{ secrets.STATUS_SEARXNG_URL }}
          STATUS_IMMICH_URL: ${{ secrets.STATUS_IMMICH_URL }}
        run: python3 .github/scripts/generate_status.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
